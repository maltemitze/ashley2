<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Herz ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
}

#c {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
}

/* Startscreen */
#textBox {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: Arial;
    text-align: center;
    z-index: 10;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 16px;
    background: hotpink;
    border: none;
    border-radius: 10px;
    color: white;
}
</style>
</head>

<body>

<div id="textBox">
    <div>
        <h2>Ashley ich liebe dich</h2>
        <p>Drück mich</p>
        <button onclick="start()">Weiter</button>
    </div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    const dpr = window.devicePixelRatio || 1;

    const width = window.innerWidth;
    const height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    // 👉 DAS ist der wichtigste Fix
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

let offset = 0;

function start() {
    document.getElementById("textBox").style.display = "none";
    draw();
}

function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;

    const scale = 12;

    for (let i = 0; i < 600; i++) {
        let t = (i + offset) / 20;

        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        let px = cx + x * scale;
        let py = cy - y * scale;

        ctx.fillStyle = "hotpink";

        if (i % 15 === 0) {
            ctx.font = "14px Arial";
            ctx.textAlign = "center";
            ctx.fillText("I love you", px, py);
        } else {
            ctx.fillRect(px, py, 2, 2);
        }
    }

    offset += 0.8;
    requestAnimationFrame(draw);
}
</script>

</body>
</html>
